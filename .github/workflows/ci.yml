name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (CPU analysis extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[analysis]"
          pip install pytest
      - name: Unit tests (no model weights)
        run: pytest tests/ -q
      - name: Tier-S sensitivity smoke
        run: python analysis/sensitivity_resonance_decay.py
