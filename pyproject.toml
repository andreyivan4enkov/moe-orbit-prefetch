[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-orbit-prefetch"
version = "0.5.2"
description = "Object A: MoE orbit prefetch — research prototype (Apache-2.0). Laptop-lab evidence; weights not shipped."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "andreyivan4enkov" }]
keywords = [
  "mixture-of-experts",
  "moe",
  "expert-prefetch",
  "deepseek",
  "dynamic-inference",
  "safetensors",
  "sparse-moe",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
examples = [
  "torch>=2.1",
  "safetensors>=0.4",
  "huggingface_hub>=0.23",
]
runtime = [
  "torch>=2.1",
  "safetensors>=0.4",
  "huggingface_hub>=0.23",
  "transformers>=4.40",
]
analysis = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]
bench = [
  "torch>=2.1",
  "safetensors>=0.4",
  "huggingface_hub>=0.23",
  "transformers>=4.40",
  "psutil>=5.9",
]
dev = [
  "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/andreyivan4enkov/moe-orbit-prefetch"
Issues = "https://github.com/andreyivan4enkov/moe-orbit-prefetch/issues"

[tool.setuptools.packages.find]
where = ["src"]
